<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipper</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e8eaf0; --muted:#8b93a5; --accent:#4f8cff; --ok:#3ecf8e; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 20px; }
  h2 { font-size: 16px; margin: 32px 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing:.04em; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  #drop { border:2px dashed var(--line); border-radius:12px; padding:36px 16px; text-align:center; cursor:pointer; transition:.15s; }
  #drop.over { border-color:var(--accent); background:#151c2b; }
  #drop strong { display:block; font-size:17px; margin-bottom:4px; }
  #drop span { color:var(--muted); }
  .row { display:flex; align-items:center; gap:12px; justify-content:space-between; flex-wrap:wrap; }
  .muted { color:var(--muted); font-size:13px; }
  .bar { height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:8px; }
  .bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  .list > * + * { margin-top:10px; }
  .clips { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; margin-top:12px; }
  .clip video { width:100%; aspect-ratio:9/16; background:#000; border-radius:10px; }
  .clip .row { margin-top:6px; }
  a.btn, button.btn { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:6px 12px; font-size:13px; text-decoration:none; cursor:pointer; }
  button.ghost { background:transparent; color:var(--bad); border:1px solid var(--line); }
  .pill { display:inline-block; padding:2px 10px; border-radius:99px; font-size:12px; background:var(--line); color:var(--muted); }
  .pill.run { background:#1d3a66; color:#9cc2ff; }
  .err { color:var(--bad); font-size:13px; white-space:pre-wrap; word-break:break-word; }
  .empty { color:var(--muted); padding:8px 0; }
  textarea { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; resize:vertical; }
  .dl { border-top:1px solid var(--line); padding-top:10px; }
  .dl .u { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60%; }
</style>
</head>
<body>
<main>
  <h1>Clipper</h1>

  <div id="drop">
    <strong>Seret video mentah ke sini</strong>
    <span>atau klik untuk memilih file (.mp4 .mov .mkv .webm .avi .m4v)</span>
    <input id="file" type="file" accept="video/*,.mkv" multiple hidden>
  </div>
  <div id="uploads" class="list" style="margin-top:12px"></div>

  <h2>Atau tempel link</h2>
  <div class="card">
    <textarea id="links" rows="3" placeholder="Tempel link YouTube / Google Drive / link video langsung. Satu link per baris."></textarea>
    <div class="row" style="margin-top:10px">
      <span class="muted">Google Drive harus diset "Siapa saja yang memiliki link".</span>
      <button class="btn" id="sendLinks">Unduh otomatis</button>
    </div>
    <div id="downloads" class="list" style="margin-top:12px"></div>
  </div>

  <h2>Sedang diproses</h2>
  <div id="status" class="card"></div>

  <h2>Hasil klip</h2>
  <div id="results" class="list"></div>

  <div id="failedWrap" hidden>
    <h2>Gagal</h2>
    <div id="failed" class="list"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const mb = (n) => (n / 1048576).toFixed(1) + " MB";
const enc = encodeURIComponent;

// ---------- Upload ----------
const drop = $("drop"), input = $("file");
drop.onclick = () => input.click();
input.onchange = () => { upload([...input.files]); input.value = ""; };
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); upload([...e.dataTransfer.files]); };

let uploadChain = Promise.resolve();
function upload(files) {
  for (const f of files) {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `<div class="row"><span>${esc(f.name)} <span class="muted">${mb(f.size)}</span></span><span class="muted">menunggu...</span></div><div class="bar"><i></i></div>`;
    $("uploads").prepend(el);
    uploadChain = uploadChain.then(() => sendOne(f, el));
  }
}
function sendOne(f, el) {
  return new Promise((resolve) => {
    const label = el.querySelector(".row > span:last-child");
    const bar = el.querySelector(".bar > i");
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/upload");
    xhr.setRequestHeader("x-filename", enc(f.name));
    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const p = Math.round((e.loaded / e.total) * 100);
      bar.style.width = p + "%";
      label.textContent = p + "%";
    };
    xhr.onload = () => {
      if (xhr.status === 200) {
        bar.style.width = "100%";
        label.textContent = "Terunggah, masuk antrean";
        label.style.color = "var(--ok)";
        setTimeout(() => el.remove(), 6000);
      } else {
        label.textContent = "Gagal: " + (safeJson(xhr.responseText).error || xhr.status);
        label.style.color = "var(--bad)";
      }
      refresh(); resolve();
    };
    xhr.onerror = () => { label.textContent = "Gagal terhubung"; label.style.color = "var(--bad)"; resolve(); };
    xhr.send(f);
  });
}
$("sendLinks").onclick = async () => {
  const urls = $("links").value.split(/\s+/).filter(Boolean);
  if (!urls.length) return;
  const r = await fetch("/api/link", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ urls }) });
  const j = await r.json().catch(() => ({}));
  if (j.ok) $("links").value = "";
  else alert("Tidak ada link http/https yang valid.");
  refresh();
};
$("downloads").onclick = async (e) => {
  const id = e.target.dataset && e.target.dataset.dismiss;
  if (!id) return;
  await fetch("/api/dismiss/" + enc(id), { method: "POST" });
  refresh();
};
function safeJson(t) { try { return JSON.parse(t); } catch { return {}; } }

// ---------- State ----------
let lastResultsSig = "";
async function refresh() {
  let s;
  try { s = await (await fetch("/api/state")).json(); } catch { return; }

  $("downloads").innerHTML = s.downloads.map((d) => `
    <div class="dl">
      <div class="row"><span class="u" title="${esc(d.url)}">${esc(d.url)}</span>
        <span class="pill ${d.status === "mengunduh" ? "run" : ""}" ${d.status === "gagal" ? 'style="color:var(--bad)"' : d.status === "selesai" ? 'style="color:var(--ok)"' : ""}>${esc(d.status)}${d.status === "mengunduh" ? " " + Math.round(d.progress) + "%" : ""}</span></div>
      ${d.status === "mengunduh" ? `<div class="bar"><i style="width:${d.progress}%"></i></div>` : ""}
      ${d.error ? `<div class="err">${esc(d.error)}</div><button class="btn ghost" data-dismiss="${esc(d.id)}" style="margin-top:6px">Tutup</button>` : ""}
    </div>`).join("");

  const st = s.status;
  let html = "";
  if (st) {
    html += `<div class="row"><strong>${esc(st.file)}</strong><span class="pill run">${esc(st.stage)}</span></div>`;
    if (st.detail) html += `<div class="muted">${esc(st.detail)}</div>`;
  } else {
    html += `<div class="empty">Tidak ada proses berjalan.</div>`;
  }
  const waiting = s.queue.filter((q) => !st || q.name !== st.file);
  if (waiting.length) {
    html += `<div class="muted" style="margin-top:10px">Antrean (${waiting.length}):</div>`;
    html += waiting.map((q) => `<div class="row"><span>${esc(q.name)}</span><span class="muted">${mb(q.size)}</span></div>`).join("");
  }
  $("status").innerHTML = html;

  const sig = JSON.stringify(s.results);
  if (sig !== lastResultsSig) {
    lastResultsSig = sig;
    $("results").innerHTML = s.results.length
      ? s.results.map((r) => `
        <div class="card">
          <div class="row">
            <strong>${esc(r.id)}</strong>
            <button class="btn ghost" data-del="${esc(r.id)}">Hapus</button>
          </div>
          <div class="clips">
            ${r.clips.map((c) => {
              const u = `/files/${enc(r.id)}/${enc(c.name)}`;
              return `<div class="clip">
                <video src="${u}" controls preload="metadata" playsinline></video>
                <div class="row"><span class="muted">${esc(c.name)} · ${mb(c.size)}</span><a class="btn" href="${u}?download=1">Unduh</a></div>
              </div>`;
            }).join("")}
          </div>
        </div>`).join("")
      : `<div class="empty">Belum ada hasil.</div>`;
  }

  $("failedWrap").hidden = s.failed.length === 0;
  $("failed").innerHTML = s.failed.map((f) => `
    <div class="card"><div class="row"><strong>${esc(f.name)}</strong><span class="muted">${mb(f.size)}</span></div>
    ${f.error ? `<div class="err">${esc(f.error)}</div>` : ""}</div>`).join("");
}

$("results").onclick = async (e) => {
  const id = e.target.dataset && e.target.dataset.del;
  if (!id) return;
  if (!confirm(`Hapus semua klip "${id}"? Tidak bisa dibatalkan.`)) return;
  await fetch("/api/delete/" + enc(id), { method: "POST" });
  lastResultsSig = ""; refresh();
};

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
